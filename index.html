/* ===================== Car Land's own racing look (layout and features unchanged) ===================== */
:root{--ff:"Nunito","Trebuchet MS",system-ui,sans-serif;--fh:"Russo One","Nunito",sans-serif;--acc:#ff5a1f;--bg:#edf0f6;--bd:#dbe1ec;--tx:#141a2e;--mut:#5d6684;--navy:#121a33;--navy2:#1b2546;--navy3:#26335e;--race:#ff5a1f;--race2:#ffb400}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#161e36;--tx:#eef2ff;--mut:#9aa6c8;--acc:#ff7036;--bd:#27325a}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#161e36;--tx:#eef2ff;--mut:#9aa6c8;--acc:#ff7036;--bd:#27325a}
body{font-family:var(--ff)}
h1,h2,h3,.ph,.big2,.playb,.rkt,.bigtitle,.gem b{font-family:var(--fh)!important;font-weight:800!important;letter-spacing:.4px}
/* top bar: dark asphalt with a dashed yellow lane line */
.w>header{background:linear-gradient(180deg,var(--navy2),var(--navy))!important;border-bottom:0!important;box-shadow:0 6px 18px #0a10233a!important}
.w>header::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;background:repeating-linear-gradient(90deg,var(--race2) 0 34px,var(--navy) 34px 58px)}
.w>header h1{text-shadow:0 3px 0 #000a!important;font-size:2.05rem!important;letter-spacing:1.5px!important;font-style:italic}
.w>header .pill{background:#ffffff14!important;border:1.5px solid #ffffff2e!important;color:#fff!important;box-shadow:none!important;border-radius:12px!important}
.w>header .menub{background:#ffffff14!important;border-color:#ffffff33!important}
/* side menu: night-drive navy with a chequered flag strip and racing-orange highlights */
.sb{background:linear-gradient(180deg,var(--navy2),var(--navy) 70%)!important;border-right:1px solid #ffffff10}
.sb::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:conic-gradient(#fff 25%,#0000 0 50%,#fff 0 75%,#0000 0) 0 0/10px 10px;opacity:.22;pointer-events:none}
.sb nav .t{color:#c9d3ee!important;font-weight:700!important;border-radius:12px!important;transition:background .15s,transform .15s}
.sb nav .t:hover{background:#ffffff12!important;transform:translateX(2px)}
.sb nav .t.on{background:linear-gradient(90deg,var(--race),#ff8a3d)!important;color:#fff!important;box-shadow:0 6px 16px #ff5a1f4d}
.sb nav .playb{background:linear-gradient(120deg,var(--race),var(--race2))!important;box-shadow:0 5px 0 #a8380a,0 10px 22px #ff5a1f40!important;border-radius:14px!important;position:relative;overflow:hidden;font-family:var(--fh)!important;letter-spacing:1px;color:#fff!important;text-shadow:0 2px 0 #0005}
.sb nav .playb::after{content:"";position:absolute;right:0;top:0;bottom:0;width:44px;background:conic-gradient(#fff 25%,#0000 0 50%,#fff 0 75%,#0000 0) 0 0/11px 11px;opacity:.38;-webkit-mask:linear-gradient(90deg,transparent,#000);mask:linear-gradient(90deg,transparent,#000)}
.sb nav .playb.on{outline:3px solid #ffffffcc!important}
/* buttons and cards */
button:not([class]){background:linear-gradient(180deg,#ff6c30,#f24b0f);box-shadow:0 3px 0 #b5390b;border-radius:11px}
button:not([class]):active{transform:translateY(2px);box-shadow:0 1px 0 #b5390b}
button:not([class]):disabled{background:#9aa3b8;box-shadow:0 3px 0 #6f7891}
button.t.on{border-color:var(--race)!important;color:var(--race)!important}
.plseg button.t.on,.bldtabs button.on,.bldg button.on,.blkbar .t.on{color:#fff!important;background:linear-gradient(180deg,#ff6c30,#f24b0f)!important;border-color:#f24b0f!important}
.card{border:1px solid var(--bd)!important;border-radius:14px!important;box-shadow:0 1px 0 #0b10200a,0 8px 22px #1a234412}
/* Cars page: night city instead of the sky with floating shapes */
body.blkbg{background:linear-gradient(180deg,#1b2546 0%,#121a33 55%,#0b1020 100%) fixed!important}
body.blkbg::before{background-image:radial-gradient(#ffffff12 1.2px,transparent 1.6px),linear-gradient(90deg,transparent 49.6%,#ffb40018 49.6% 50.4%,transparent 50.4%)!important;background-size:16px 16px,100% 80px!important;opacity:1!important}
body.carsbg main{background:linear-gradient(180deg,#26335e 0%,#1b2546 60%,#141c38 100%)!important}
.bigtitle{color:#fff!important;text-shadow:0 4px 0 #ff5a1f,0 5px 0 #ff5a1f,0 10px 18px #0007!important;font-style:italic}
.prof,.blkp,.blks,.chk{background-color:#202c55!important;background-image:linear-gradient(135deg,#ffffff07 25%,transparent 25% 50%,#ffffff07 50% 75%,transparent 75%)!important;background-size:12px 12px!important;border-color:#34457e!important;box-shadow:0 7px 0 #0c1226,0 14px 26px #0006!important}
.pav{background:#121a33!important;border-color:#ff5a1f!important}
.blkbar .t.on{color:var(--race)!important}.bt .cnt{border-color:#202c55!important}

function mpCfg(){if(!S.mp||typeof S.mp!=="object")S.mp={on:false,room:"public"};if(!Array.isArray(S.friends))S.friends=[];S.friends=S.friends.filter(f=>f&&typeof f.fid==="string");return S.mp}
const isFriend=fid=>(S.friends||[]).some(f=>f.fid===fid);
const mpOkFid=f=>typeof f==="string"&&/^[A-Za-z0-9]{4,12}$/.test(f);
function mpReq(path,body,keep){const base=bzBase();if(!base)return Promise.resolve(null);return fetch(base+path+".json",{method:body===null?"DELETE":"PUT",body:body===null?undefined:JSON.stringify(body),keepalive:!!keep,cache:"no-store"}).then(r=>{if(r.status===401||r.status===403)MPW.st="rules";return r}).catch(()=>null)}
function mpSet(k,v){if(!mpOkFid(k))return;if(k===S.fid){if(v&&+v.t)MPW.off=+v.t-Date.now();return}
 if(!v||typeof v!=="object"||!Number.isInteger(v.i)||!C[v.i]||C[v.i][2]>9||!Number.isFinite(+v.x)||!Number.isFinite(+v.y)){delete MPW.pl[k];return}
 const now=Date.now(),old=MPW.pl[k],srv=now+(MPW.off||0),age=+v.t?Math.max(0,Math.min(900000,srv-(+v.t))):0;
 const n=String(v.n||"Player").slice(0,14),fr=(S.friends||[]).find(f=>f.fid===k);if(fr&&fr.name!==n){fr.name=n;save()}const p=old||{x:+v.x,y:+v.y,a:+v.a||0,px:+v.px||+v.x,py:+v.py||+v.y,pa:+v.pa||0,odo:0,ph:0};
 Object.assign(p,{fid:k,raw:v,n,i:v.i,tx:+v.x,ty:+v.y,ta:+v.a||0,v:+v.v||0,w:!!v.w,home:+v.w===2,tpx:+v.px||+v.x,tpy:+v.py||+v.y,tpa:+v.pa||0,g:v.g?1:0,l:!!((+v.l||0)&1),ind:((+v.l||0)>>1)&3,dr:((+v.l||0)>>3)&63,dead:!!((+v.l||0)&512),b:!!v.b,na:String(v.na||"none").slice(0,12),fx:String(v.fx||"none").slice(0,12),rt:old?now:now-age});
 if(!old&&age>180000&&MPW.room)mpReq("/world/"+MPW.room+"/"+k,null);
 MPW.pl[k]=p}
const mpList=()=>{const now=Date.now();return Object.values(MPW.pl).filter(p=>now-p.rt<9000).map(p=>(p.fr=isFriend(p.fid),p))};
function mpTick(dt){const now=Date.now(),k=Math.min(1,dt*7),ang=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*k};
 for(const p of Object.values(MPW.pl)){const lead=Math.min(.45,(now-p.rt)/1000),ex=p.tx+Math.cos(p.ta)*p.v*lead,ey=p.ty+Math.sin(p.ta)*p.v*lead;
  if(Math.hypot(ex-p.x,ey-p.y)>600){p.x=ex;p.y=ey;p.a=p.ta}else{p.x+=(ex-p.x)*k;p.y+=(ey-p.y)*k;p.a=ang(p.a,p.ta)}
  if(Math.hypot(p.tpx-p.px,p.tpy-p.py)>400){p.px=p.tpx;p.py=p.tpy}else{p.px+=(p.tpx-p.px)*k;p.py+=(p.tpy-p.py)*k}p.pa=ang(p.pa,p.tpa);
  p.odo+=(p.w?0:p.v)*dt;p.ph+=(p.w?Math.min(60,Math.abs(p.v)):0)*dt*.12}}
function mpPub(){const D=DRV;if(!MPW.on||!D||MPW.busy)return;const r=v=>Math.round(v*10)/10,
 o={n:myName().slice(0,14),i:D.i,x:Math.round(D.x),y:Math.round(D.y),a:r(D.a),v:Math.round(D.walk?(D.pv||0):(D.vx*Math.cos(D.a)+D.vy*Math.sin(D.a))),w:D.inH?2:D.walk?1:0,px:Math.round(D.pw.x),py:Math.round(D.pw.y),pa:r(D.pw.a),g:(S.set&&S.set.gender==="girl")?1:0,l:(D.lights?1:0)|((D.walk?0:D.ind||0)<<1)|((D.dr||0)<<3)|(D.dead?512:0),b:D.brk&&!D.walk?1:0,na:naPack(myNA().a,myNA().f),fx:myNA().fx},sig=JSON.stringify(o),now=Date.now();
 if(sig===MPW.last&&now-MPW.lt<2500)return;MPW.last=sig;MPW.lt=now;o.t={".sv":"timestamp"};MPW.busy=true;
 mpReq("/world/"+MPW.room+"/"+S.fid,o).then(res=>{MPW.busy=false;if(res&&res.ok){MPW.fails=0;if(MPW.st!=="rules")MPW.st=MPW.es&&MPW.es.readyState===1?"ok":MPW.st}else if(!res){MPW.fails=(MPW.fails||0)+1;if(MPW.fails>3)MPW.st="net"}})}
function mpOnline(){if(!MPW.on)return;mpReq("/online/"+S.fid,{n:myName().slice(0,14),r:MPW.room,t:{".sv":"timestamp"}})}
function mpStart(){mpStop();const cfg=RQ?{on:RQ.mode==="mp",room:"race"+RQ.tid}:mpCfg();if(!cfg.on||!DRV)return;const base=bzBase();MPW={on:true,pl:{},st:base?"connecting":"noaddr",room:mpRoomKey(cfg.room),last:"",lt:0,fails:0,busy:false,off:0};if(!base)return;
 const path="/world/"+MPW.room;
 try{const es=new EventSource(base+path+".json");MPW.es=es;
  const put=e=>{try{const j=JSON.parse(e.data);if(!j)return;const parts=String(j.path||"/").split("/").filter(Boolean);
    if(!parts.length){MPW.pl={};if(j.data&&typeof j.data==="object")for(const k in j.data)mpSet(k,j.data[k])}
    else if(parts.length===1)mpSet(parts[0],j.data);
    else{const k=parts[0],cur=Object.assign({},(MPW.pl[k]||{}).raw||{});cur[parts[1]]=j.data;mpSet(k,cur)}MPW.st="ok"}catch(x){}};
  const patch=e=>{try{const j=JSON.parse(e.data);if(!j||!j.data)return;const parts=String(j.path||"/").split("/").filter(Boolean);
    if(!parts.length){for(const k in j.data)mpSet(k,j.data[k])}else{const k=parts[0];mpSet(k,Object.assign({},(MPW.pl[k]||{}).raw||{},j.data))}MPW.st="ok"}catch(x){}};
  es.addEventListener("put",put);es.addEventListener("patch",patch);es.addEventListener("cancel",()=>{MPW.st="rules"});es.addEventListener("auth_revoked",()=>{MPW.st="rules"});
  es.onopen=()=>{if(MPW.st!=="rules")MPW.st="ok"};es.onerror=()=>{if(MPW.st!=="rules"&&(!MPW.es||MPW.es.readyState!==1))MPW.st="net"}}catch(e){MPW.st="net"}
 MPW.pubT=setInterval(mpPub,330);mpPub();mpOnline();MPW.olT=setInterval(mpOnline,20000);MPW.unload=()=>mpLeave(true);window.addEventListener("pagehide",MPW.unload)}
function mpLeave(keep){if(!MPW.room)return;mpReq("/world/"+MPW.room+"/"+S.fid,null,keep);mpReq("/online/"+S.fid,null,keep)}
function mpStop(){if(!MPW||!MPW.on)return;try{MPW.es&&MPW.es.close()}catch(e){}clearInterval(MPW.pubT);clearInterval(MPW.olT);if(MPW.unload)window.removeEventListener("pagehide",MPW.unload);mpLeave(true);MPW={on:false,pl:{},st:"off"}}
const MPMSG={connecting:"⏳ Connecting…",ok:"🟢 Connected",noaddr:"⚠️ Multiplayer needs the online database. Open Settings → 🛒 Bazaar and paste your Firebase address.",rules:"⚠️ The database is locked. In Firebase open Realtime Database → Rules and allow “world” and “online” (see the rules file).",net:"⚠️ Can’t reach the online world. Check your internet."};

function mpPanel(){const pn=$("mpp"),D=DRV;if(!pn||!D)return;MPW.pdT=Date.now();const me=D.walk?D.pw:D,L=mpList().sort((a,b)=>(b.fr-a.fr)||a.n.localeCompare(b.n));

 pn.innerHTML=`<div class="row" style="align-items:center"><b>👥 Room “${esc(MPW.room)}”</b><button class="t" id="mpx" style="flex:none;padding:4px 10px">✕</button></div><small>${MPMSG[MPW.st]||""}</small>
 ${L.length?L.map(p=>`<div class="mpr"><span><b>${p.fr?"⭐ ":""}${esc(p.n)}</b><br><small>${esc(C[p.i][0])}${p.home?" · 🏠 at home":p.w?" · 🚶 walking":""} · ${esc(where(p))} · ${dist(p)} m</small></span><span>${p.fr?"":`<button class="t" data-mpf="${esc(p.fid)}" style="flex:none;padding:4px 8px" title="Add friend">➕</button>`}${p.home?"":`<button data-mpg="${esc(p.fid)}" style="flex:none;padding:4px 10px">📍 Go</button>`}</span></div>`).join(""):`<p><small>Nobody else is here yet. Tell your friends to choose <b>Multiplayer</b> and the room <b>${esc(MPW.room)}</b>.</small></p>`}
 ${(S.friends||[]).filter(f=>!L.some(p=>p.fid===f.fid)).length?`<small>Friends not here: ${(S.friends||[]).filter(f=>!L.some(p=>p.fid===f.fid)).map(f=>esc(f.name||f.fid)).join(", ")}</small>`:""}`;
 $("mpx").onclick=()=>{pn.style.display="none"};
 pn.querySelectorAll("[data-mpg]").forEach(b=>b.onclick=()=>{const p=MPW.pl[b.dataset.mpg];if(!p||!DRV)return;const tx=p.w?p.px:p.x,ty=p.w?p.py:p.y,ta=p.w?p.pa:p.a;
  if(D.walk){D.pw.x=tx-Math.cos(ta)*30;D.pw.y=ty-Math.sin(ta)*30;D.pw.a=ta}else{D.x=tx-Math.cos(ta)*70;D.y=ty-Math.sin(ta)*70;D.a=ta;D.vx=D.vy=0}D.sc=null;pn.style.display="none";const e=$("dmsg");if(e){e.textContent="📍 You’re next to "+p.n+"!";e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}});
 pn.querySelectorAll("[data-mpf]").forEach(b=>b.onclick=()=>{const p=MPW.pl[b.dataset.mpf];if(p&&!isFriend(p.fid)){S.friends.push({fid:p.fid,name:p.n});save();mpPanel()}})}

const NEWS=[["Calibri font","The whole game now uses Calibri, a clean, easy-to-read font. Fonts you picked for your name tag still work.","5.1"],["Racing!","Tap ▶ Play and pick 🏁 Race or 🚗 Free Drive. The account called Harsh is always the Owner, and lots of players can use the same name. The Verified, Owner, Admin, Moderator, VIP, Cool guy and Neon guy name tag effects got a big upgrade. Race on 10 Grand Prix circuits away from the city: Monza, Silverstone, Spa, Suzuka, Monaco, Interlagos, Yas Marina, Bahrain, Austin and Melbourne, with wide tracks, kerbs, gravel traps, grandstands and start lights. Race 5 NPC drivers (Easy, Normal or Hard) or race other players in a lobby. The Rare Market now restocks every 6 hours with a countdown timer, people in Free Drive look more realistic, and opening a pack is now a longer racing animation: start lights, a race with a mystery car, a photo finish for rare cars and a podium. Every pack is now a racing pack, plus 13 new ones: Rookie, Drift King, Rally Legends, Stock Car, Hill Climb, Night Race, Silent Speed, Scuderia, Raging Bull, Endurance 24 Hours, Nitro, Photo Finish and World Champion.","5.0"],["3 new cities to drive","Drive to ❄️ Frostville (snowy, east of Neon Bay), 🌸 Sakura City (cherry blossoms, south of Neon Bay) and 🍁 Maple Town (autumn leaves, over the sea bridge east of Palm Island). Highways and border gates connect them all.","4.9"],["Advent Calendar, drift switch and a 370° wheel","🎄 An Advent Calendar appears in the menu from 1 to 20 December with a present behind every door. The Drift button now stays on until you tap it again. The steering wheel turns 370° each way.","4.8"],["More residences, quizzes and a real steering wheel","👑 4 more Private Residence areas: Car Land Gardens, Neon Bay Heights, Sunset Valley Ranches and Palm Island Villas. 13 new quiz subjects in Discover, including UAE & Dubai, Formula 1, Video Games and Korean. The steering wheel now turns 280° each way and springs back to the middle."," her players. Add friends with their friend code: they get a green ⭐ name tag and a green dot on the map, and you can tap 📍 Go to drive straight to them.","3.7"],["Every rarity in every pack","26 new cars, and now every pack can give all 8 rarities, from Common to Mystical.","3.6"],["10 more packs","Budget, Epic, Diamond and Chroma packs, plus Off-Road, Retro, Track Day, French, Korea & China and Swedish packs.","3.5"],["Bazaar","Sell your cars to other players for any price, and buy theirs. Open 🛒 Bazaar. It needs a free Firebase database (see Settings).","3.4"],["Upgrade your cars","Tap 🔧 Upgrade cars on the Cars page. Spend coins on Engine, Turbo, Tyres, Suspension, Brakes and Nitro (5 levels each).","3.3"],["Car info","Tap ℹ️ Car info on the Cars page to see speed, acceleration, handling and more for every car.","3.2"],["Driving sounds and spinning wheels","Hear the engine, tyres, wind and crashes while you drive. Wheels spin very fast on your cars. Turn sound off with the 🔊 button.","3.1"],["Community sets in Discover","Make a set, tap 🌍 Share and send the code to the owner. When it is added, it shows up in Discover for everyone.","3.0"],["Play with friends","Pick Solo or 2 to 4 players before a quiz. Pass the device around and see who wins.","2.9"],["Languages and 8 more subjects","Quiz yourself in Spanish, French, German, Italian, Arabic, Japanese, Hindi and Mandarin, plus Flags & Capitals, Landmarks, Plants & Nature, Chemistry, Physics, Coding, Money and Festivals. Use the buttons in Discover to find them.","2.8"],["9 new packs","Mini, Lucky, Mega and Golden packs, plus Japan, German, Italian, American and British packs. Find them in the Market.","2.7"],["Longer pack opening and fairer packs","Opening a pack is now a long, dramatic show, and packs give mostly Commons and Uncommons with a lucky rare pull. ","2.6"],["Island, bigger map and floating coins","Car Land is much bigger, there is a new Palm Island, and gold coins float around the roads. Every coin you async function takeRole(fid,rid){fid=cleanId(fid);const A=RASSIGN[fid],ids=ridsOf(A).filter(k=>k!==rid);if(!ids.length){await rdb("DELETE","/rassign/"+fid);delete RASSIGN[fid]}else{const rids={};ids.forEach(k=>rids[k]=true);const rec=Object.assign({},A,{rid:ids[0],rids,ts:Date.now()});await rdb("PUT","/rassign/"+fid,rec);RASSIGN[fid]=rec}if(fid===S.fid)roleApply()}
async function rdb(method,path,body){const base=bzBase();if(!base)throw new Error("noaddr");const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),9000);try{const r=await fetch(base+path+".json",{method,body:body!==undefined?JSON.stringify(body):undefined,cache:"no-store",signal:ctl.signal});if(!r.ok)throw new Error("http"+r.status);return await r.json()}finally{clearTimeout(to)}}

 S.myrole=nr;S.myroles=rs.map(r=>({id:r.id,name:r.name}));S.roleAdm=rs.some(r=>r.panel);S.builder=rs.some(r=>r.build);
 if(JSON.stringify([S.myrole,!!S.roleAdm,S.myroles,!!S.builder])!==was){ISADM=ISOWN||!!S.adm||S.roleAdm;const t=$("adm");if(t)t.style.display=ISADM?"":"none";save();upd();advNav();if(view==="admin"&&!ISADM){view="shop";render()}else if(view==="builder"&&!bldCan()){view="shop";render()}else{if(S.roleAdm&&!wasAdm)toast("🛠️ You got a panel role. The Admin tab is open for you.");if(S.builder&&!wasB)toast("🏗️ You are a Builderman! Open the Builder tab for cars, or tap Build in Free Drive to change the map.")}}}
function roleWatchOld(){DB.collection("rdefs").onSnapshot(s=>{RDEFS={};s.docs.forEach(d=>{const v=d.data();if(v&&v.id)RDEFS[v.id]=v});roleApply();if(view==="admin")rolesCard()},()=>{},4000);
 DB.collection("rassign").onSnapshot(s=>{RASSIGN={};s.docs.forEach(d=>{const v=d.data();if(v&&v.fid)RASSIGN[v.fid]=v});roleApply();if(view==="admin")rolesCard()},()=>{},4000)}
function rolesCard(){const el=$("rlc");if(!el)return;if(!ISOWN){el.style.display="none";return}el.style.display="";
 if(!bzBase()){el.innerHTML="<b>🎭 Roles and admins</b><p><small>Roles need the online database. They work on your GitHub or Netlify website.</small></p>";return}
 if(!RNEW)RNEW={e:"🛡️",c:BCOL[3],panel:true};
 RDEFS.admin=ADMIN_ROLE;RDEFS.builder=BUILDER_ROLE;const keep=el.querySelector("#rn")?$("rn").value:"",roles=Object.values(RDEFS).sort((a,b)=>(a.builtin?-1:0)-(b.builtin?-1:0)||(a.ts||0)-(b.ts||0)),as=Object.values(RASSIGN).sort((a,b)=>(b.ts||0)-(a.ts||0)),adms=as.filter(a=>ridsOf(a).includes("admin"));
 el.innerHTML=`<b>🛠️ Admins (owner only)</b><p><small>Give a player the Admin panel, or take it away again. Pick them from the list, or type their Player ID (they can find it in Settings).</small></p>
 <p><select id="app" style="max-width:100%"><option value="">Pick a player…</option>${RPR.filter(p=>p.fid&&p.fid!==S.fid).sort((a,b)=>(b.ts||0)-(a.ts||0)).map(p=>`<option value="${esc(p.fid)}">${esc(p.name||"Player")}${Date.now()-(p.ts||0)<300000?" 🟢":""} · ID ${esc(p.fid)}</option>`).join("")}</select> or <input id="apid" placeholder="Player ID" maxlength="20" style="width:130px;text-transform:uppercase"> <button id="agv" style="flex:none">⭐ Give admin</button></p>
 ${adms.length?adms.map(a=>`<div class="row" style="align-items:center"><span>${esc(a.name||"Player")} <small>ID ${esc(a.fid)}</small> ${roleChip(a)}</span><button class="t" data-rxr="${esc(a.fid)}|admin" style="flex:none;padding:6px 10px">Take admin away</button></div>`).join(""):"<p><small>Nobody else is an admin yet.</small></p>"}
 <hr style="border:0;border-top:2px dashed #0002;margin:16px 0"><b>🎭 Roles (owner only)</b><p><small>Make roles like Moderator or VIP and give them to players. A player can have <b>more than one role</b>, and two roles can have the <b>same name</b>. The built-in <b>Builderman</b> role lets someone make new cars, merge cars, customise any car (colour, shade, length, width, height and size) and build on the Free Drive map. Anyone who unlocks admin with the code, and anyone whose username starts with <b>Harsh</b>, gets it automatically. A <b>panel role</b> lets that person open the Admin panel. A role that is <b>not a panel role</b> is only a title next to their name.</small></p>
 <p><input id="rn" maxlength="16" placeholder="Role name, like Moderator" style="width:100%" value="${esc(keep)}"></p>

 <p style="margin:14px 0 4px"><b>Your roles</b></p>${roles.length?roles.map(r=>`<div class="row" style="align-items:center"><span>${roleChip({rid:r.id})}<br><small>${r.build?"🏗️ Builds cars and the Free Drive map":r.panel?"🛠️ Panel role":"🏷️ Not a panel role"} · ${as.filter(a=>ridsOf(a).includes(r.id)).length} player${as.filter(a=>ridsOf(a).includes(r.id)).length===1?"":"s"}</small></span><span>${r.builtin?"<small>Built in</small>":`<button class="t" data-rt="${esc(r.id)}" style="flex:none;padding:6px 10px">${r.panel?"Make it not a panel role":"Make it a panel role"}</button> <button class="ic on" data-rd="${esc(r.id)}" title="Delete role">🗑️</button>`}</span></div>`).join(""):"<p><small>No roles yet.</small></p>"}

 ${(()=>{const L=[];as.forEach(a=>ridsOf(a).forEach(rid=>{if(rid!=="admin"&&RDEFS[rid])L.push([a,rid])}));return L.length?L.map(([a,rid])=>`<div class="row" style="align-items:center"><span>${esc(a.name||"Player")} <small>ID ${esc(a.fid)}</small> ${roleChip({rid})}</span><button class="ic on" data-rxr="${esc(a.fid)}|${esc(rid)}" title="Take this role away">✕</button></div>`).join(""):"<p><small>Nobody has a role yet.</small></p>"})()}`;
